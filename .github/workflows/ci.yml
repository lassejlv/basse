name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (Postgres-backed tests must run, not skip)
        run: cargo test --workspace --locked
        env:
          # <ENV_PREFIX>_TEST_REQUIRE_DOCKER, see crates/common/src/brand.rs.
          BASSE_TEST_REQUIRE_DOCKER: "1"
      - name: Lint install.sh
        run: shellcheck -s sh install.sh
