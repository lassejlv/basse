name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (Postgres-backed tests must run, not skip)
        run: cargo test --workspace --locked
        env:
          # <ENV_PREFIX>_TEST_REQUIRE_DOCKER, see crates/common/src/brand.rs.
          BASSE_TEST_REQUIRE_DOCKER: "1"
      - name: Lint the install scripts
        run: shellcheck -s sh install.sh uninstall.sh

  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - '.github/workflows/ci.yml'

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
