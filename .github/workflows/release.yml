name: release

# Builds static Linux binaries (daemon + CLI) and macOS CLI binaries.
# Pull requests only build; a pushed v* tag publishes a GitHub release that install.sh downloads.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", ".github/workflows/release.yml", "install.sh", "uninstall.sh"]
  workflow_dispatch:

env:
  # Product names; keep in sync with crates/common/src/brand.rs and install.sh.
  CLI_BIN: basse
  DAEMON_BIN: bassed
  PREFIX: basse
  ENV_PREFIX: BASSE

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            packages: -p daemon -p cli
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            packages: -p daemon -p cli
          - target: aarch64-apple-darwin
            os: macos-15
            packages: -p cli
          - target: x86_64-apple-darwin
            os: macos-15
            packages: -p cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          bins="$CLI_BIN"
          [[ "${{ matrix.packages }}" == *daemon* ]] && bins="$DAEMON_BIN $CLI_BIN"
          mkdir -p dist
          archive="dist/$CLI_BIN-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$out" $bins
          (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          for b in $bins; do "$out/$b" --version || file "$out/$b"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-musl
          path: dist
      # Release first, then the build: a build that adds migrations cannot be downgraded to a
      # release that does not know them, but the release must upgrade to it in place.
      - name: Install a server from the latest published release
        run: |
          sudo sh ./install.sh --no-firewall
          $CLI_BIN status
      - name: Upgrade it in place to the built archive
        run: |
          sudo sh ./install.sh --archive "dist/$CLI_BIN-x86_64-unknown-linux-musl.tar.gz" --no-firewall
          $CLI_BIN status
          sudo basse status
          $CLI_BIN setup --status
          curl -fsS http://127.0.0.1:7700/healthz
          docker ps
      - name: Instance backup and restore under systemd
        run: |
          set -eux
          $CLI_BIN project create disaster
          printf 'correct horse battery staple' > pass.txt
          $CLI_BIN instance backup --passphrase-file pass.txt
          $CLI_BIN instance download -o instance.enc
          $CLI_BIN project delete disaster --yes
          sudo "$DAEMON_BIN" restore instance.enc --passphrase-file pass.txt
          systemctl is-active "$DAEMON_BIN"
          $CLI_BIN project list | grep disaster
          $CLI_BIN project delete disaster --yes
      - name: Self-update under systemd from a local release
        run: |
          set -eux
          tag="v$($DAEMON_BIN --version | awk '{print $2}')"
          mkdir -p "release/download/$tag"
          cp dist/* "release/download/$tag/"
          printf '{"tag_name": "%s"}' "$tag" > release/latest
          (cd release && nohup python3 -m http.server 8899 >/dev/null 2>&1 &)
          sudo mkdir -p "/etc/systemd/system/$DAEMON_BIN.service.d"
          printf '[Service]\nEnvironment=%s_RELEASE_URL=http://127.0.0.1:8899\n' "$ENV_PREFIX" |
            sudo tee "/etc/systemd/system/$DAEMON_BIN.service.d/release.conf"
          sudo systemctl daemon-reload
          sudo systemctl restart "$DAEMON_BIN"
          until curl -fsS http://127.0.0.1:7700/healthz; do sleep 1; done
          before=$(systemctl show -p MainPID --value "$DAEMON_BIN")
          $CLI_BIN update --tag "$tag" --force
          for _ in $(seq 30); do
            after=$(systemctl show -p MainPID --value "$DAEMON_BIN")
            [ "$after" != "$before" ] && [ "$after" != 0 ] && break
            sleep 1
          done
          test "$after" != "$before"
          until curl -fsS http://127.0.0.1:7700/healthz; do sleep 1; done
          sudo journalctl -u "$DAEMON_BIN" --no-pager | grep "exiting so systemd starts the new version"
          $CLI_BIN status
      - name: Deploy an app with a volume
        run: |
          $CLI_BIN project create smoke
          $CLI_BIN service create smoke web --image traefik/whoami --port 80 --volume data:/data
          docker ps --filter "label=$PREFIX.managed=true"
      - name: Install and uninstall only the CLI
        run: |
          set -eux
          sh ./install.sh --cli --archive "dist/$CLI_BIN-x86_64-unknown-linux-musl.tar.gz"
          "$HOME/.local/bin/$CLI_BIN" status
          test -f "$HOME/.config/$CLI_BIN/config.toml"
          sh ./uninstall.sh --cli --yes
          test ! -e "$HOME/.local/bin/$CLI_BIN"
          test ! -e "$HOME/.config/$CLI_BIN"
      - name: Uninstall with --purge
        run: |
          set -eux
          sudo sh ./uninstall.sh --purge --yes
          if systemctl cat "$DAEMON_BIN" >/dev/null 2>&1; then exit 1; fi
          if curl -fsS http://127.0.0.1:7700/healthz; then exit 1; fi
          test ! -e "/usr/local/bin/$DAEMON_BIN"
          test ! -e "/usr/local/bin/$CLI_BIN"
          test -z "$(docker ps -aq --filter "label=$PREFIX.managed=true")"
          if docker inspect "$PREFIX-proxy" >/dev/null 2>&1; then exit 1; fi
          test ! -d "/var/lib/$CLI_BIN"
          test -n "$(docker volume ls -q --filter "label=$PREFIX.managed=true")"
      - name: Uninstall with --purge --volumes deletes the app volumes
        run: |
          set -eux
          sudo sh ./uninstall.sh --purge --volumes --yes
          test -z "$(docker volume ls -q --filter "label=$PREFIX.managed=true")"
      - name: Daemon logs
        if: failure()
        run: sudo journalctl -u "$DAEMON_BIN" --no-pager -n 200 || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
