[package]
name = "daemon"
description = "Control daemon: HTTP API, deploy pipeline and Docker orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bassed"
path = "src/main.rs"

[dependencies]
common.workspace = true
release.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
bollard = { version = "0.21", features = ["chrono"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "json", "migrate", "macros"] }
tar = "0.4"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
sysinfo = "0.37"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7", features = ["io"] }
chacha20poly1305 = { version = "0.10", features = ["std", "stream"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "ecdsa"] }
zeroize = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
flate2 = "1"
rust-s3 = { version = "0.38", default-features = false, features = ["fail-on-err", "tokio-rustls-tls"] }

[dev-dependencies]
client.workspace = true
tempfile = "3"

[lints]
workspace = true
